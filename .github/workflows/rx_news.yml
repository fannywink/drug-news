# 의료용 마약류 브리핑(주 3회) → 카드뉴스 → GitHub Pages 게시 → 카카오톡 전송
name: rx-drug-news

on:
  schedule:
    - cron: "7 22 * * 0,2,4"   # UTC 일·화·목 22:07 = 한국 월·수·금 07:07
  workflow_dispatch:         # Actions 화면에서 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-pages   # 의료용 마약류 브리핑과 겹치지 않게 차례대로 실행
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지·브라우저·한글 폰트 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: 기사 수집·요약·카드뉴스 생성
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python collect_rx.py

      # 지난 브리핑 보관용 저장. GitHub 쪽 일시 오류로 실패해도 3번까지 다시 시도하고,
      # 끝내 실패해도 오늘 카드뉴스 게시·카톡 전송은 그대로 진행함
      - name: 결과 저장(커밋)
        continue-on-error: true
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs
          git commit -m "의료용 마약류 브리핑 $(date +%Y-%m-%d)" || echo "변경 없음"
          for i in 1 2 3; do
            if git pull --rebase -q && git push; then exit 0; fi
            echo "저장 실패, 20초 뒤 다시 시도 ($i/3)"
            sleep 20
          done
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # GitHub 쪽 일시 오류로 게시가 실패하면 1분 뒤 한 번 더 시도함
      - name: GitHub Pages 게시
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: 게시 실패 시 1분 대기
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - name: GitHub Pages 게시(재시도)
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: 카카오톡 전송
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEWS_SUBDIR: rx
        run: python send_kakao.py
