# 의료용 마약류 브리핑(주 3회) → 카드뉴스 → GitHub Pages 게시 → 카카오톡 전송
name: rx-drug-news

on:
  schedule:
    - cron: "7 22 * * 0,2,4"   # UTC 일·화·목 22:07 = 한국 월·수·금 07:07
  workflow_dispatch:         # Actions 화면에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: news-pages   # 의료용 마약류 브리핑과 겹치지 않게 차례대로 실행
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지·브라우저·한글 폰트 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: 기사 수집·요약·카드뉴스 생성
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python collect_rx.py

      # 결과를 저장소 docs 폴더에 저장하면 GitHub Pages가 자동으로 웹페이지를 갱신함
      # (Settings → Pages → Deploy from a branch: main /docs)
      # GitHub 쪽 일시 오류에 대비해 30초 간격으로 5번까지 다시 시도함
      - name: 결과 저장·웹페이지 게시
        run: |
          touch docs/.nojekyll
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs
          git commit -m "의료용 마약류 브리핑 $(date +%Y-%m-%d)" || echo "변경 없음"
          for i in 1 2 3 4 5; do
            if git pull --rebase -q && git push; then exit 0; fi
            echo "저장 실패, 30초 뒤 다시 시도 ($i/5)"
            sleep 30
          done
          exit 1

      - name: 카카오톡 전송
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEWS_SUBDIR: rx
        run: python send_kakao.py
